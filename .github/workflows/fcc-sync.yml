name: Sync freeCodeCamp Ecosystem Progress

on:
  schedule:
    - cron: '0 21 * * *' # Runs automatically every night at 9:00 PM UTC
  workflow_dispatch: # Allows manual trigger button for instant syncs

jobs:
  sync-progress:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Fetch and Categorize freeCodeCamp Data
      run: |
        # 1. Download your profile JSON data
        curl -s "https://freecodecamp.org/api/users/get-public-profile?username=grois333" > fcc_data.json

        # 2. Build a public tracking dashboard organized by themes
        echo "# 🎓 My Complete freeCodeCamp Learning Ecosystem" > README.md
        echo "This profile dashboard is automatically updated by reading my freeCodeCamp timeline activity." >> README.md
        echo "" >> README.md
        echo "## 📊 Quick Summary" >> README.md
        
        # Calculate total completed tasks
        TOTAL_TASKS=$(jq '.entities.user[].completedChallenges | length' fcc_data.json 2>/dev/null || echo "0")
        echo "* **Total Checkmarks Earned:** $TOTAL_TASKS tasks successfully passed!" >> README.md
        echo "* **Last Sync:** $(date)" >> README.md
        echo "" >> README.md
        
        echo "## 🛠️ Progress Sorted by Technology & Theme" >> README.md
        echo "" >> README.md

        echo "### 🌐 Web Development & Responsive Design" >> README.md
        jq -r '.entities.user[].completedChallenges[] | select(.block | test("responsive-web-design|html|css"; "i")) | "* [x] \(.name)"' fcc_data.json | sort -u >> README.md
        echo "" >> README.md

        echo "### 🟨 JavaScript Algorithms & Programming Structure" >> README.md
        jq -r '.entities.user[].completedChallenges[] | select(.block | test("javascript|algo|es6"; "i")) | "* [x] \(.name)"' fcc_data.json | sort -u >> README.md
        echo "" >> README.md

        echo "### ⚙️ Back-End Development & APIs" >> README.md
        jq -r '.entities.user[].completedChallenges[] | select(.block | test("back-end|api|node|mongo"; "i")) | "* [x] \(.name)"' fcc_data.json | sort -u >> README.md
        echo "" >> README.md

        echo "### 📈 Data Science & Python Ecosystem" >> README.md
        jq -r '.entities.user[].completedChallenges[] | select(.block | test("python|data-analysis|machine-learning"; "i")) | "* [x] \(.name)"' fcc_data.json | sort -u >> README.md
        echo "" >> README.md

        echo "### 📜 Other Earned Certificates & Challenges" >> README.md
        jq -r '.entities.user[].completedChallenges[] | select(.block | test("responsive-web-design|html|css|javascript|algo|es6|back-end|api|node|mongo|python|data-analysis|machine-learning"; "i") | not) | "* [x] \(.name)"' fcc_data.json | sort -u >> README.md

    - name: Commit and Push to GitHub
      run: |
        git config --global user.name "Ecosystem Sync Bot"
        git config --global user.email "actions@github.com"
        git add README.md
        git commit -m "Sync all past and current freeCodeCamp accomplishments [skip ci]" || echo "No changes to commit"
        git push
