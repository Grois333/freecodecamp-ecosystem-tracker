name: Sync freeCodeCamp Ecosystem Progress

on:
  schedule:
    - cron: '0 21 * * *' # Runs every night at 9:00 PM UTC
  workflow_dispatch: # Manual trigger button

jobs:
  sync-progress:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Fetch and Build freeCodeCamp Dashboard
      run: |
        # 1. Query freeCodeCamp's official public profile API with browser User-Agent
        curl -s -L -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
             -H "Accept: application/json" \
             "https://www.freecodecamp.org/api/users/get-public-profile?username=grois333" > fcc_api.json

        # 2. Extract completed challenges array safely
        jq '.entities.user.grois333.completedChallenges // []' fcc_api.json > completed.json

        # 3. Calculate total completed tasks
        TOTAL_TASKS=$(jq 'length' completed.json)

        # 4. Create docs directory for category sub-files
        mkdir -p docs

        # 5. Build Sub-Files for Detailed Views
        echo "# 🌐 Web Development & Responsive Design" > docs/web-development.md
        echo "Detailed log of completed Web Development challenges." >> docs/web-development.md
        echo "" >> docs/web-development.md

        echo "# 🟨 JavaScript Algorithms & Data Structures" > docs/javascript.md
        echo "Detailed log of completed JavaScript challenges." >> docs/javascript.md
        echo "" >> docs/javascript.md

        echo "# ⚙️ Back-End Development & APIs" > docs/backend.md
        echo "Detailed log of completed Back-End and API challenges." >> docs/backend.md
        echo "" >> docs/backend.md

        # 6. Populate Sub-Files with real Challenge IDs and Dates
        if [ "$TOTAL_TASKS" -gt 0 ]; then
          jq -r '.[] | "* [x] Challenge ID: `\(.id)` (Completed: \(.completedDate / 1000 | strftime("%Y-%m-%d")))"' completed.json >> docs/web-development.md
          jq -r '.[] | "* [x] Challenge ID: `\(.id)` (Completed: \(.completedDate / 1000 | strftime("%Y-%m-%d")))"' completed.json >> docs/javascript.md
          jq -r '.[] | "* [x] Challenge ID: `\(.id)` (Completed: \(.completedDate / 1000 | strftime("%Y-%m-%d")))"' completed.json >> docs/backend.md
        else
          echo "*(No completed challenges found. Ensure your timeline is set to Public in freeCodeCamp settings.)*" >> docs/web-development.md
          echo "*(No completed challenges found. Ensure your timeline is set to Public in freeCodeCamp settings.)*" >> docs/javascript.md
          echo "*(No completed challenges found. Ensure your timeline is set to Public in freeCodeCamp settings.)*" >> docs/backend.md
        fi

        # 7. Generate Main README.md Table
        echo "# 🎓 My Complete freeCodeCamp Learning Ecosystem" > README.md
        echo "Automated dashboard tracking my [freeCodeCamp profile](https://www.freecodecamp.org/grois333)." >> README.md
        echo "" >> README.md
        echo "## 📊 Progress Overview" >> README.md
        echo "" >> README.md
        echo "| Metric | Value |" >> README.md
        echo "| --- | --- |" >> README.md
        echo "| **Total Completed Challenges** | **${TOTAL_TASKS:-0}** |" >> README.md
        echo "| **Last Automated Sync** | $(date -u +'%Y-%m-%d %H:%M UTC') |" >> README.md
        echo "| **Profile Link** | [freecodecamp.org/grois333](https://www.freecodecamp.org/grois333) |" >> README.md
        echo "" >> README.md
        echo "## 🛠️ Category Breakdowns" >> README.md
        echo "" >> README.md
        echo "| Category Theme | Details & Tasks | Status |" >> README.md
        echo "| --- | --- | --- |" >> README.md
        echo "| 🌐 **Web Development & CSS** | [View Full Task List](./docs/web-development.md) | Active |" >> README.md
        echo "| 🟨 **JavaScript Algorithms** | [View Full Task List](./docs/javascript.md) | Active |" >> README.md
        echo "| ⚙️ **Back-End & APIs** | [View Full Task List](./docs/backend.md) | Active |" >> README.md

    - name: Commit and Push Changes
      run: |
        git config --global user.name "Ecosystem Sync Bot"
        git config --global user.email "actions@github.com"
        git add README.md docs/
        git commit -m "Sync freeCodeCamp metrics and sub-files [skip ci]" || echo "No changes to commit"
        git push
