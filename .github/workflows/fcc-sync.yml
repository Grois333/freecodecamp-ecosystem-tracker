name: Sync freeCodeCamp Ecosystem Progress

on:
  schedule:
    - cron: '0 21 * * *' # Runs every night at 9:00 PM UTC
  workflow_dispatch: # Allows manual trigger button

jobs:
  sync-progress:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Fetch and Parse freeCodeCamp Data
      run: |
        # 1. Fetch public API with proper user headers
        curl -s -L -H "User-Agent: Mozilla/5.0" "https://api.freecodecamp.org/internal/api/users/get-public-profile?username=grois333" > fcc_raw.json

        # 2. Check if valid JSON was received
        if jq empty fcc_raw.json 2>/dev/null; then
          echo "Valid JSON received from freeCodeCamp API."
          jq '.entities.user.grois333 // {}' fcc_raw.json > fcc_user.json
        else
          echo "API returned HTML or Cloudflare challenge, creating fallback profile payload."
          echo '{"completedChallenges": []}' > fcc_user.json
        fi

        # 3. Calculate metrics
        TOTAL_TASKS=$(jq '.completedChallenges | length' fcc_user.json 2>/dev/null || echo "0")

        # 4. Build README
        echo "# 🎓 My Complete freeCodeCamp Learning Ecosystem" > README.md
        echo "This profile dashboard is automatically updated by reading my freeCodeCamp activity." >> README.md
        echo "" >> README.md
        echo "## 📊 Quick Summary" >> README.md
        echo "* **Total Tasks Passed:** $TOTAL_TASKS challenges completed!" >> README.md
        echo "* **Last Sync:** $(date)" >> README.md
        echo "" >> README.md
        echo "## 🛠️ Completed Challenges (IDs)" >> README.md
        echo "" >> README.md

        if [ "$TOTAL_TASKS" -gt 0 ]; then
          jq -r '.completedChallenges[]? | "* [x] Challenge ID: `\(.id)` (Completed: \(.completedDate | todateiso8601 // "Yes"))"' fcc_user.json >> README.md
        else
          echo "*(No completed tasks returned by API endpoint or profile is syncing...)*" >> README.md
        fi

    - name: Commit and Push to GitHub
      run: |
        git config --global user.name "Ecosystem Sync Bot"
        git config --global user.email "actions@github.com"
        git add README.md
        git commit -m "Sync freeCodeCamp progress [skip ci]" || echo "No changes to commit"
        git push
