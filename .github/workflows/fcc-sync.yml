name: Sync freeCodeCamp Ecosystem Progress

on:
  schedule:
    - cron: '0 21 * * *' # Runs every night at 9:00 PM UTC
  workflow_dispatch: # Manual trigger button

jobs:
  sync-progress:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code with Personal Access Token
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_PAT }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Puppeteer
      run: npm install puppeteer

    - name: Scrape All Pages via Headless Browser
      run: |
        node -e '
        const puppeteer = require("puppeteer");
        const fs = require("fs");

        (async () => {
          const browser = await puppeteer.launch({
            headless: "new",
            args: ["--no-sandbox", "--disable-setuid-sandbox"]
          });
          const page = await browser.newPage();

          await page.setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36");
          await page.setViewport({ width: 1280, height: 1000 });
          await page.goto("https://www.freecodecamp.org/grois333", { waitUntil: "networkidle2" });

          let allChallenges = [];
          let pageNum = 1;

          while (true) {
            console.log(`Scraping page ${pageNum}...`);

            const pageChallenges = await page.evaluate(() => {
              const rows = Array.from(document.querySelectorAll("table tbody tr"));
              return rows.map(row => {
                const cells = row.querySelectorAll("td");
                return {
                  title: cells[0]?.innerText?.trim() || "",
                  date: cells[1]?.innerText?.trim() || ""
                };
              }).filter(item => item.title.length > 0 && item.title !== "Completed Challenge");
            });

            allChallenges.push(...pageChallenges);

            const nextButton = await page.evaluateHandle(() => {
              const buttons = Array.from(document.querySelectorAll("button, a"));
              return buttons.find(b => {
                const aria = b.getAttribute("aria-label") || "";
                const text = b.innerText || "";
                return (aria.toLowerCase().includes("next") || text === ">" || aria.toLowerCase().includes("go to next page")) && !b.disabled;
              }) || null;
            });

            if (!nextButton || !(await nextButton.asElement())) {
              console.log("Reached last page.");
              break;
            }

            try {
              const firstRowBeforeClick = pageChallenges[0]?.title || "";
              await nextButton.click();
              await page.waitForFunction(
                (oldTitle) => {
                  const firstCell = document.querySelector("table tbody tr td");
                  return firstCell && firstCell.innerText.trim() !== oldTitle;
                },
                { timeout: 5000 },
                firstRowBeforeClick
              );
            } catch (err) {
              await new Promise(r => setTimeout(r, 1000));
            }

            pageNum++;
          }

          console.log(`Successfully scraped total tasks: ${allChallenges.length}`);
          fs.writeFileSync("latest_completed.json", JSON.stringify(allChallenges, null, 2));
          await browser.close();
        })();
        '

    - name: Sync New Completions (one commit per task, newest-first)
      run: |
        set -e

        if [ ! -f "completed.json" ]; then
          echo "[]" > completed.json
        fi
        mkdir -p docs

        # True set-difference on the tasks themselves (not a raw file diff),
        # so page-render-order noise from Puppeteer can never register as a
        # "change." $latest keeps the site's own ordering, which lists the
        # most recently completed challenge first.
        jq -s '.[0] - .[1]' latest_completed.json completed.json > new_items.json
        NEW_ITEM_COUNT=$(jq 'length' new_items.json)

        if [ "$NEW_ITEM_COUNT" -eq 0 ]; then
          echo "No new tasks completed. Skipping build and commit."
          exit 0
        fi
        echo "Found $NEW_ITEM_COUNT new completed task(s)."

        git config --global user.name "grois333"
        git config --global user.email "isaacgroisman@gmail.com"

        init_file() {
          # 3-line header (title, desc, blank) only if the file doesn't exist yet;
          # new entries always get inserted at line 4, i.e. right after this header.
          local f="$1" title="$2" desc="$3"
          if [ ! -f "$f" ]; then
            { echo "# $title"; echo "$desc"; echo ""; } > "$f"
          fi
        }
        init_file docs/web-development.md "🌐 Web Development & Responsive Design" "Detailed log of completed Web Development & HTML/CSS challenges, newest first."
        init_file docs/javascript.md "🟨 JavaScript Algorithms & Data Structures" "Detailed log of completed JavaScript & Programming challenges, newest first."
        init_file docs/backend.md "⚙️ Back-End Development & APIs" "Detailed log of completed Back-End, Node, and API challenges, newest first."
        init_file docs/all-tasks.md "📜 All Completed Tasks Log" "Full chronological log of every completed challenge, newest first."

        prepend_line() {
          local f="$1" line="$2"
          awk -v l="$line" 'NR==4{print l} {print}' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
        }

        # Process oldest-of-the-new-batch -> newest-of-the-new-batch. Each
        # iteration inserts right after the header, so by the time we're
        # done the newest task ends up on top everywhere, and (since git log
        # shows newest commit first) the commit history reads the same way.
        for i in $(seq $((NEW_ITEM_COUNT - 1)) -1 0); do
          ITEM=$(jq -c ".[$i]" new_items.json)
          TITLE=$(echo "$ITEM" | jq -r '.title')
          DATE=$(echo "$ITEM" | jq -r '.date')
          LINE="* [x] $TITLE"
          [ -n "$DATE" ] && LINE="$LINE ($DATE)"

          prepend_line docs/all-tasks.md "$LINE"

          if echo "$TITLE" | grep -qiE "html|css|web|responsive|flexbox|grid|canvas|form|transformer|formatter|cat photo|cafe menu|marker|nutrition|accessibility|balance sheet|tribute|survey|technical documentation|product landing|portfolio"; then
            prepend_line docs/web-development.md "$LINE"
          fi
          if echo "$TITLE" | grep -qiE "javascript|js|string|array|object|algo|es6|function|loop|method|console|pyramid|gradebook|teacher|palindrom|roman|cipher|cash|telephone"; then
            prepend_line docs/javascript.md "$LINE"
          fi
          if echo "$TITLE" | grep -qiE "back-end|backend|api|node|express|mongo|database|microservice|timestamp|header parser|url shortener|exercise tracker|file metadata"; then
            prepend_line docs/backend.md "$LINE"
          fi

          jq --argjson item "$ITEM" '[$item] + .' completed.json > completed.json.tmp && mv completed.json.tmp completed.json
          TOTAL=$(jq 'length' completed.json)

          {
            echo "# 🎓 My Complete freeCodeCamp Learning Ecosystem"
            echo "Automated dashboard tracking my [freeCodeCamp profile](https://www.freecodecamp.org/grois333)."
            echo ""
            echo "## 📊 Progress Overview"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| **Total Completed Tasks** | **$TOTAL** |"
            echo "| **Most Recent Task** | $TITLE${DATE:+ ($DATE)} |"
            echo "| **Last Progress Update** | $(date -u +'%Y-%m-%d %H:%M UTC') |"
            echo "| **Profile Link** | [freecodecamp.org/grois333](https://www.freecodecamp.org/grois333) |"
            echo ""
            echo "## 🛠️ Category Breakdowns"
            echo ""
            echo "| Category Theme | Details & Tasks | Status |"
            echo "| --- | --- | --- |"
            echo "| 🌐 **Web Development & CSS** | [View Web Dev Tasks](./docs/web-development.md) | Active |"
            echo "| 🟨 **JavaScript Algorithms** | [View JS Tasks](./docs/javascript.md) | Active |"
            echo "| ⚙️ **Back-End & APIs** | [View Back-End Tasks](./docs/backend.md) | Active |"
            echo "| 📜 **Complete Task Log** | [View All Tasks Log](./docs/all-tasks.md) | Complete |"
          } > README.md

          git add README.md docs/ completed.json
          git commit -m "freeCodeCamp: completed \"$TITLE\"${DATE:+ ($DATE)}"
        done

        git push origin main
