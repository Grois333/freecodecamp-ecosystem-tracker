name: Sync freeCodeCamp Ecosystem Progress

on:
  schedule:
    - cron: '0 21 * * *' # Runs every night at 9:00 PM UTC
  workflow_dispatch: # Manual trigger button

jobs:
  sync-progress:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code with Personal Access Token
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_PAT }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Puppeteer
      run: npm install puppeteer

    - name: Scrape All Pages via Headless Browser
      run: |
        node -e '
        const puppeteer = require("puppeteer");
        const fs = require("fs");

        (async () => {
          const browser = await puppeteer.launch({
            headless: "new",
            args: ["--no-sandbox", "--disable-setuid-sandbox"]
          });
          const page = await browser.newPage();

          await page.setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36");
          await page.setViewport({ width: 1280, height: 1000 });
          await page.goto("https://www.freecodecamp.org/grois333", { waitUntil: "networkidle2" });

          let allChallenges = [];
          let pageNum = 1;

          while (true) {
            console.log(`Scraping page ${pageNum}...`);

            const pageChallenges = await page.evaluate(() => {
              const rows = Array.from(document.querySelectorAll("table tbody tr"));
              return rows.map(row => {
                const cells = row.querySelectorAll("td");
                return {
                  title: cells[0]?.innerText?.trim() || "",
                  date: cells[1]?.innerText?.trim() || ""
                };
              }).filter(item => item.title.length > 0 && item.title !== "Completed Challenge");
            });

            allChallenges.push(...pageChallenges);

            const nextButton = await page.evaluateHandle(() => {
              const buttons = Array.from(document.querySelectorAll("button, a"));
              return buttons.find(b => {
                const aria = b.getAttribute("aria-label") || "";
                const text = b.innerText || "";
                return (aria.toLowerCase().includes("next") || text === ">" || aria.toLowerCase().includes("go to next page")) && !b.disabled;
              }) || null;
            });

            if (!nextButton || !(await nextButton.asElement())) {
              console.log("Reached last page.");
              break;
            }

            try {
              const firstRowBeforeClick = pageChallenges[0]?.title || "";
              await nextButton.click();
              await page.waitForFunction(
                (oldTitle) => {
                  const firstCell = document.querySelector("table tbody tr td");
                  return firstCell && firstCell.innerText.trim() !== oldTitle;
                },
                { timeout: 5000 },
                firstRowBeforeClick
              );
            } catch (err) {
              await new Promise(r => setTimeout(r, 1000));
            }

            pageNum++;
          }

          // Sort deterministically so re-scrapes of the same data always
          // serialize identically, regardless of the order the site renders
          // rows in on a given run. This is what makes the diff check below
          // trustworthy.
          allChallenges.sort((a, b) => {
            if (a.title === b.title) return a.date.localeCompare(b.date);
            return a.title.localeCompare(b.title);
          });

          console.log(`Successfully scraped total tasks: ${allChallenges.length}`);
          fs.writeFileSync("latest_completed.json", JSON.stringify(allChallenges, null, 2));
          await browser.close();
        })();
        '

    - name: Evaluate Progress & Conditionally Build Markdown
      id: check_progress
      run: |
        # Initialize files if missing
        if [ ! -f "completed.json" ]; then
          echo "[]" > completed.json
        fi

        # Compare scraped list against recorded baseline
        NEW_COUNT=$(jq 'length' latest_completed.json 2>/dev/null || echo "0")
        OLD_COUNT=$(jq 'length' completed.json 2>/dev/null || echo "0")

        echo "Previous task count: $OLD_COUNT"
        echo "Current task count:  $NEW_COUNT"

        # Canonicalize both files (sorted keys + sorted array) before comparing,
        # so incidental ordering/whitespace differences from the scrape never
        # register as "real" changes. This is the actual fix: the old code
        # diffed the raw files, which flagged a change any time the site
        # returned the same rows in a different order.
        jq -S 'sort_by(.title, .date)' completed.json > /tmp/old_sorted.json
        jq -S 'sort_by(.title, .date)' latest_completed.json > /tmp/new_sorted.json

        DIFF_CHECK=$(diff -u /tmp/old_sorted.json /tmp/new_sorted.json || true)

        if [ -z "$DIFF_CHECK" ]; then
          echo "No new tasks completed. Skipping build and commit."
          echo "has_changes=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "New completion activity detected! Generating markdown files..."
        echo "has_changes=true" >> $GITHUB_OUTPUT

        # Save new dataset as baseline
        cp latest_completed.json completed.json

        mkdir -p docs

        # 1. Initialize Sub-Files
        echo "# 🌐 Web Development & Responsive Design" > docs/web-development.md
        echo "Detailed log of completed Web Development & HTML/CSS challenges." >> docs/web-development.md
        echo "" >> docs/web-development.md

        echo "# 🟨 JavaScript Algorithms & Data Structures" > docs/javascript.md
        echo "Detailed log of completed JavaScript & Programming challenges." >> docs/javascript.md
        echo "" >> docs/javascript.md

        echo "# ⚙️ Back-End Development & APIs" > docs/backend.md
        echo "Detailed log of completed Back-End, Node, and API challenges." >> docs/backend.md
        echo "" >> docs/backend.md

        echo "# 📜 All Completed Tasks Log" > docs/all-tasks.md
        echo "Full chronological log of every completed challenge." >> docs/all-tasks.md
        echo "" >> docs/all-tasks.md

        # 2. Populate Categorized Checklists
        if [ "$NEW_COUNT" -gt 0 ]; then
          jq -r '.[] | select(.title | test("html|css|web|responsive|flexbox|grid|canvas|form|transformer|formatter|cat photo|cafe menu|marker|nutrition|accessibility|balance sheet|tribute|survey|technical documentation|product landing|portfolio"; "i")) | "* [x] \(.title) \({date: .date} | if .date != "" then "(\(.date))" else "" end)"' completed.json | sort -u >> docs/web-development.md

          jq -r '.[] | select(.title | test("javascript|js|string|array|object|algo|es6|function|loop|method|console|pyramid|gradebook|teacher|palindrom|roman|cipher|cash|telephone"; "i")) | "* [x] \(.title) \({date: .date} | if .date != "" then "(\(.date))" else "" end)"' completed.json | sort -u >> docs/javascript.md

          jq -r '.[] | select(.title | test("back-end|backend|api|node|express|mongo|database|microservice|timestamp|header parser|url shortener|exercise tracker|file metadata"; "i")) | "* [x] \(.title) \({date: .date} | if .date != "" then "(\(.date))" else "" end)"' completed.json | sort -u >> docs/backend.md

          jq -r '.[] | "* [x] \(.title) \({date: .date} | if .date != "" then "(\(.date))" else "" end)"' completed.json >> docs/all-tasks.md
        fi

        [ $(wc -l < docs/web-development.md) -le 3 ] && echo "*(No matching tasks found in this category)*" >> docs/web-development.md
        [ $(wc -l < docs/javascript.md) -le 3 ] && echo "*(No matching tasks found in this category)*" >> docs/javascript.md
        [ $(wc -l < docs/backend.md) -le 3 ] && echo "*(No matching tasks found in this category)*" >> docs/backend.md

        # 3. Generate Main README.md Dashboard
        echo "# 🎓 My Complete freeCodeCamp Learning Ecosystem" > README.md
        echo "Automated dashboard tracking my [freeCodeCamp profile](https://www.freecodecamp.org/grois333)." >> README.md
        echo "" >> README.md
        echo "## 📊 Progress Overview" >> README.md
        echo "" >> README.md
        echo "| Metric | Value |" >> README.md
        echo "| --- | --- |" >> README.md
        echo "| **Total Completed Tasks** | **$NEW_COUNT** |" >> README.md
        echo "| **Last Progress Update** | $(date -u +'%Y-%m-%d %H:%M UTC') |" >> README.md
        echo "| **Profile Link** | [freecodecamp.org/grois333](https://www.freecodecamp.org/grois333) |" >> README.md
        echo "" >> README.md
        echo "## 🛠️ Category Breakdowns" >> README.md
        echo "" >> README.md
        echo "| Category Theme | Details & Tasks | Status |" >> README.md
        echo "| --- | --- | --- |" >> README.md
        echo "| 🌐 **Web Development & CSS** | [View Web Dev Tasks](./docs/web-development.md) | Active |" >> README.md
        echo "| 🟨 **JavaScript Algorithms** | [View JS Tasks](./docs/javascript.md) | Active |" >> README.md
        echo "| ⚙️ **Back-End & APIs** | [View Back-End Tasks](./docs/backend.md) | Active |" >> README.md
        echo "| 📜 **Complete Task Log** | [View All Tasks Log](./docs/all-tasks.md) | Complete |" >> README.md

    - name: Commit and Push Changes (Only on real progress)
      if: steps.check_progress.outputs.has_changes == 'true'
      run: |
        git config --global user.name "grois333"
        git config --global user.email "isaacgroisman@gmail.com"
        git add README.md docs/ completed.json
        git commit -m "Sync freeCodeCamp progress: new tasks completed [skip ci]"
        git push origin main
