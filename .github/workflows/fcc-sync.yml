name: Sync freeCodeCamp Ecosystem Progress

on:
  schedule:
    - cron: '0 21 * * *' # Runs every night at 9:00 PM UTC
  workflow_dispatch: # Manual trigger button

jobs:
  sync-progress:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Puppeteer
      run: npm install puppeteer

    - name: Scrape Profile via Headless Browser
      run: |
        node -e '
        const puppeteer = require("puppeteer");
        const fs = require("fs");

        (async () => {
          const browser = await puppeteer.launch({ headless: "new" });
          const page = await browser.newPage();
          await page.goto("https://www.freecodecamp.org/grois333", { waitUntil: "networkidle2" });

          // Extract completed challenge names from the rendered timeline table
          const challenges = await page.evaluate(() => {
            const rows = Array.from(document.querySelectorAll("table tbody tr"));
            return rows.map(row => {
              const cells = row.querySelectorAll("td");
              return {
                title: cells[0]?.innerText?.trim() || "Completed Challenge",
                date: cells[1]?.innerText?.trim() || ""
              };
            }).filter(item => item.title !== "Completed Challenge");
          });

          fs.writeFileSync("completed.json", JSON.stringify(challenges, null, 2));
          await browser.close();
        })();
        '

    - name: Build Dashboard & Markdown Files
      run: |
        TOTAL_TASKS=$(jq 'length' completed.json 2>/dev/null || echo "0")

        mkdir -p docs

        # Generate Category Sub-Files
        echo "# 🌐 Web Development & Responsive Design" > docs/web-development.md
        echo "Detailed log of completed Web Development challenges." >> docs/web-development.md
        echo "" >> docs/web-development.md

        echo "# 🟨 JavaScript Algorithms & Data Structures" > docs/javascript.md
        echo "Detailed log of completed JavaScript challenges." >> docs/javascript.md
        echo "" >> docs/javascript.md

        echo "# ⚙️ Back-End Development & APIs" > docs/backend.md
        echo "Detailed log of completed Back-End and API challenges." >> docs/backend.md
        echo "" >> docs/backend.md

        if [ "$TOTAL_TASKS" -gt 0 ]; then
          jq -r '.[] | "* [x] \(.title) \({date: .date} | if .date != "" then "(\(.date))" else "" end)"' completed.json >> docs/web-development.md
          jq -r '.[] | "* [x] \(.title) \({date: .date} | if .date != "" then "(\(.date))" else "" end)"' completed.json >> docs/javascript.md
          jq -r '.[] | "* [x] \(.title) \({date: .date} | if .date != "" then "(\(.date))" else "" end)"' completed.json >> docs/backend.md
        else
          echo "*(No completed tasks rendered on timeline)*" >> docs/web-development.md
          echo "*(No completed tasks rendered on timeline)*" >> docs/javascript.md
          echo "*(No completed tasks rendered on timeline)*" >> docs/backend.md
        fi

        # Generate Main README.md Table
        echo "# 🎓 My Complete freeCodeCamp Learning Ecosystem" > README.md
        echo "Automated dashboard tracking my [freeCodeCamp profile](https://www.freecodecamp.org/grois333)." >> README.md
        echo "" >> README.md
        echo "## 📊 Progress Overview" >> README.md
        echo "" >> README.md
        echo "| Metric | Value |" >> README.md
        echo "| --- | --- |" >> README.md
        echo "| **Total Completed Challenges** | **$TOTAL_TASKS** |" >> README.md
        echo "| **Last Automated Sync** | $(date -u +'%Y-%m-%d %H:%M UTC') |" >> README.md
        echo "| **Profile Link** | [freecodecamp.org/grois333](https://www.freecodecamp.org/grois333) |" >> README.md
        echo "" >> README.md
        echo "## 🛠️ Category Breakdowns" >> README.md
        echo "" >> README.md
        echo "| Category Theme | Details & Tasks | Status |" >> README.md
        echo "| --- | --- | --- |" >> README.md
        echo "| 🌐 **Web Development & CSS** | [View Full Task List](./docs/web-development.md) | Active |" >> README.md
        echo "| 🟨 **JavaScript Algorithms** | [View Full Task List](./docs/javascript.md) | Active |" >> README.md
        echo "| ⚙️ **Back-End & APIs** | [View Full Task List](./docs/backend.md) | Active |" >> README.md

    - name: Commit and Push Changes
      run: |
        git config --global user.name "Ecosystem Sync Bot"
        git config --global user.email "actions@github.com"
        git add README.md docs/
        git commit -m "Sync freeCodeCamp progress via Headless Browser [skip ci]" || echo "No changes to commit"
        git push
