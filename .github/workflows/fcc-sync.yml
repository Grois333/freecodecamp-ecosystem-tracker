name: Sync freeCodeCamp Ecosystem Progress

on:
  schedule:
    - cron: '0 21 * * *' # Runs every night at 9:00 PM UTC
  workflow_dispatch: # Manual trigger button

jobs:
  sync-progress:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Puppeteer
      run: npm install puppeteer

    - name: Scrape All Profile Timeline Items
      run: |
        node -e '
        const puppeteer = require("puppeteer");
        const fs = require("fs");

        (async () => {
          const browser = await puppeteer.launch({
            headless: "new",
            args: ["--no-sandbox", "--disable-setuid-sandbox"]
          });
          const page = await browser.newPage();
          
          await page.setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36");
          await page.setViewport({ width: 1280, height: 1000 });
          await page.goto("https://www.freecodecamp.org/grois333", { waitUntil: "networkidle2" });

          // Scroll deep down and click load buttons repeatedly until row count stops growing
          let previousRowCount = 0;
          let sameCountRetries = 0;

          while (sameCountRetries < 5) {
            // Click "Show More" / pagination buttons if present
            try {
              const buttons = await page.$$("button");
              for (const button of buttons) {
                const text = await page.evaluate(el => el.innerText, button);
                if (text && text.toLowerCase().includes("show more")) {
                  await button.click();
                  await new Promise(r => setTimeout(r, 1000));
                }
              }
            } catch (e) {}

            // Scroll table / window
            await page.evaluate(() => {
              window.scrollTo(0, document.body.scrollHeight);
              const tables = document.querySelectorAll("table");
              tables.forEach(t => t.scrollTop = t.scrollHeight);
            });

            await new Promise(r => setTimeout(r, 1500));

            const currentRowCount = await page.evaluate(() => document.querySelectorAll("table tbody tr").length);
            
            if (currentRowCount === previousRowCount) {
              sameCountRetries++;
            } else {
              sameCountRetries = 0;
              previousRowCount = currentRowCount;
            }
          }

          // Extract all completed challenges
          const challenges = await page.evaluate(() => {
            const rows = Array.from(document.querySelectorAll("table tbody tr"));
            return rows.map(row => {
              const cells = row.querySelectorAll("td");
              return {
                title: cells[0]?.innerText?.trim() || "",
                date: cells[1]?.innerText?.trim() || ""
              };
            }).filter(item => item.title.length > 0 && item.title !== "Completed Challenge");
          });

          fs.writeFileSync("completed.json", JSON.stringify(challenges, null, 2));
          await browser.close();
        })();
        '

    - name: Build Dashboard & Filter Category Markdown Files
      run: |
        TOTAL_TASKS=$(jq 'length' completed.json 2>/dev/null || echo "0")

        mkdir -p docs

        # 1. Initialize Sub-Files
        echo "# 🌐 Web Development & Responsive Design" > docs/web-development.md
        echo "Detailed log of completed Web Development & HTML/CSS challenges (including Legacy)." >> docs/web-development.md
        echo "" >> docs/web-development.md

        echo "# 🟨 JavaScript Algorithms & Data Structures" > docs/javascript.md
        echo "Detailed log of completed JavaScript & Programming challenges." >> docs/javascript.md
        echo "" >> docs/javascript.md

        echo "# ⚙️ Back-End Development & APIs" > docs/backend.md
        echo "Detailed log of completed Back-End, Node, and API challenges." >> docs/backend.md
        echo "" >> docs/backend.md

        echo "# 📜 All Completed Tasks Log" > docs/all-tasks.md
        echo "Full chronological log of every completed challenge." >> docs/all-tasks.md
        echo "" >> docs/all-tasks.md

        # 2. Populate Categorized Checklists with Expanded Regex
        if [ "$TOTAL_TASKS" -gt 0 ]; then
          # Web Dev Category (Includes Legacy & New Formatter/Transformer/HTML/CSS)
          jq -r '.[] | select(.title | test("html|css|web|responsive|flexbox|grid|canvas|form|transformer|formatter|cat photo|cafe menu|marker|nutrition|accessibility|balance sheet|tribute|survey|technical documentation|product landing|portfolio"; "i")) | "* [x] \(.title) \({date: .date} | if .date != "" then "(\(.date))" else "" end)"' completed.json | sort -u >> docs/web-development.md
          
          # JavaScript Category (Includes Legacy & New JS methods)
          jq -r '.[] | select(.title | test("javascript|js|string|array|object|algo|es6|function|loop|method|console|pyramid|gradebook|teacher|palindrom|roman|cipher|cash|telephone"; "i")) | "* [x] \(.title) \({date: .date} | if .date != "" then "(\(.date))" else "" end)"' completed.json | sort -u >> docs/javascript.md
          
          # Backend Category (Includes Node, Express, MongoDB, APIs, Microservices)
          jq -r '.[] | select(.title | test("back-end|backend|api|node|express|mongo|database|microservice|timestamp|header parser|url shortener|exercise tracker|file metadata"; "i")) | "* [x] \(.title) \({date: .date} | if .date != "" then "(\(.date))" else "" end)"' completed.json | sort -u >> docs/backend.md

          # Full Log File
          jq -r '.[] | "* [x] \(.title) \({date: .date} | if .date != "" then "(\(.date))" else "" end)"' completed.json >> docs/all-tasks.md
        else
          echo "*(No completed tasks rendered on timeline)*" >> docs/web-development.md
          echo "*(No completed tasks rendered on timeline)*" >> docs/javascript.md
          echo "*(No completed tasks rendered on timeline)*" >> docs/backend.md
        fi

        # Ensure empty sections display clear notice if no matching tasks completed yet
        [ $(wc -l < docs/web-development.md) -le 3 ] && echo "*(No tasks found in this section yet)*" >> docs/web-development.md
        [ $(wc -l < docs/javascript.md) -le 3 ] && echo "*(No tasks found in this section yet)*" >> docs/javascript.md
        [ $(wc -l < docs/backend.md) -le 3 ] && echo "*(No tasks found in this section yet)*" >> docs/backend.md

        # 3. Generate Main README.md Table
        echo "# 🎓 My Complete freeCodeCamp Learning Ecosystem" > README.md
        echo "Automated dashboard tracking my [freeCodeCamp profile](https://www.freecodecamp.org/grois333)." >> README.md
        echo "" >> README.md
        echo "## 📊 Progress Overview" >> README.md
        echo "" >> README.md
        echo "| Metric | Value |" >> README.md
        echo "| --- | --- |" >> README.md
        echo "| **Total Completed Tasks Scraped** | **$TOTAL_TASKS** |" >> README.md
        echo "| **Last Automated Sync** | $(date -u +'%Y-%m-%d %H:%M UTC') |" >> README.md
        echo "| **Profile Link** | [freecodecamp.org/grois333](https://www.freecodecamp.org/grois333) |" >> README.md
        echo "" >> README.md
        echo "## 🛠️ Category Breakdowns" >> README.md
        echo "" >> README.md
        echo "| Category Theme | Details & Tasks | Status |" >> README.md
        echo "| --- | --- | --- |" >> README.md
        echo "| 🌐 **Web Development & CSS** | [View Web Dev Tasks](./docs/web-development.md) | Active |" >> README.md
        echo "| 🟨 **JavaScript Algorithms** | [View JS Tasks](./docs/javascript.md) | Active |" >> README.md
        echo "| ⚙️ **Back-End & APIs** | [View Back-End Tasks](./docs/backend.md) | Active |" >> README.md
        echo "| 📜 **Complete Task Log** | [View All Tasks Log](./docs/all-tasks.md) | Complete |" >> README.md

    - name: Commit and Push Changes
      run: |
        git config --global user.name "Ecosystem Sync Bot"
        git config --global user.email "actions@github.com"
        git add README.md docs/
        git commit -m "Full timeline scrape with deep pagination and expanded legacy filters [skip ci]" || echo "No changes to commit"
        git push
