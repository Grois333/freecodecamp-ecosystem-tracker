name: Sync freeCodeCamp Ecosystem Progress

on:
  schedule:
    - cron: '0 21 * * *' # Runs automatically every night at 9:00 PM UTC
  workflow_dispatch: # Allows manual trigger button

jobs:
  sync-progress:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Fetch and Categorize freeCodeCamp Data
      run: |
        # 1. Download your public profile page using a standard browser user-agent
        curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://www.freecodecamp.org/grois333" > profile.html

        # 2. Extract the JSON embedded inside the #fcc-state script tag
        sed -n 's/.*<script id="fcc-state" type="application\/json">\([^<]*\)<\/script>.*/\1/p' profile.html > fcc_raw.json

        # 3. Isolate the user object
        jq '.entities.user.grois333 // {}' fcc_raw.json > fcc_user.json

        # 4. Build README Dashboard
        echo "# 🎓 My Complete freeCodeCamp Learning Ecosystem" > README.md
        echo "This profile dashboard is automatically updated by reading my freeCodeCamp timeline activity." >> README.md
        echo "" >> README.md
        echo "## 📊 Quick Summary" >> README.md
        
        TOTAL_TASKS=$(jq '.completedChallenges | length' fcc_user.json 2>/dev/null || echo "0")
        echo "* **Total Checkmarks Earned:** $TOTAL_TASKS tasks successfully passed!" >> README.md
        echo "* **Last Sync:** $(date)" >> README.md
        echo "" >> README.md
        
        echo "## 🛠️ Progress Sorted by Technology & Theme" >> README.md
        echo "" >> README.md

        echo "### 🌐 Web Development & Responsive Design" >> README.md
        jq -r '.completedChallenges[]? | select(.block | test("responsive-web-design|html|css"; "i")) | "* [x] \(.title // .name // .id)"' fcc_user.json | sort -u >> README.md
        echo "" >> README.md

        echo "### 🟨 JavaScript Algorithms & Programming Structure" >> README.md
        jq -r '.completedChallenges[]? | select(.block | test("javascript|algo|es6"; "i")) | "* [x] \(.title // .name // .id)"' fcc_user.json | sort -u >> README.md
        echo "" >> README.md

        echo "### ⚙️ Back-End Development & APIs" >> README.md
        jq -r '.completedChallenges[]? | select(.block | test("back-end|api|node|mongo"; "i")) | "* [x] \(.title // .name // .id)"' fcc_user.json | sort -u >> README.md
        echo "" >> README.md

        echo "### 📈 Data Science & Python Ecosystem" >> README.md
        jq -r '.completedChallenges[]? | select(.block | test("python|data-analysis|machine-learning"; "i")) | "* [x] \(.title // .name // .id)"' fcc_user.json | sort -u >> README.md
        echo "" >> README.md

        echo "### 📜 Other Earned Certificates & Challenges" >> README.md
        jq -r '.completedChallenges[]? | select(.block | test("responsive-web-design|html|css|javascript|algo|es6|back-end|api|node|mongo|python|data-analysis|machine-learning"; "i") | not) | "* [x] \(.title // .name // .id)"' fcc_user.json | sort -u >> README.md

    - name: Commit and Push to GitHub
      run: |
        git config --global user.name "Ecosystem Sync Bot"
        git config --global user.email "actions@github.com"
        git add README.md
        git commit -m "Sync all past and current freeCodeCamp accomplishments [skip ci]" || echo "No changes to commit"
        git push
